[platformio]
default_envs = assistant
extra_configs = platformio.local.ini
test_dir = tests

[env]
platform = platformio/espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:assistant]
build_src_filter = +<assistant.cpp>
board_build.partitions = partitions_wake.csv
test_framework = unity
test_filter = test_device
extra_scripts =
    pre:tools/configure.py
    pre:tools/prepare_wake.py
    pre:tools/prepare_wake_ack.py
